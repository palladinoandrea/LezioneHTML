  • Il tag <a> (anchor) definisce un collegamento ipertestuale (hyperlink)
  • Può collegare a pagine web, sezioni della stessa pagina, file, email, numeri di telefono, ecc.
  • Il contenuto tra i tag <a> e </a> è la parte cliccabile (testo, immagine, elemento)
  • L'attributo href è il più importante (definisce la destinazione del link)
  • Supporta attributi globali, specifici ed eventi
  • Fondamentale per la navigazione web

<link

    [attributi_specifici]
    [attributi_evento]

>
   UTILIZZI PRINCIPALI:
    • Collegare fogli di stile CSS (rel="stylesheet")
    • Definire icone del sito (favicon) (rel="icon")
    • Precaricare risorse (rel="preload", rel="prefetch", rel="preconnect")
    • Indicare versioni alternative (rel="alternate")
    • Indicare autore, licenza, aiuto (rel="author", rel="license", rel="help")
    • Navigazione serie (rel="next", rel="prev")
    • SEO (rel="canonical")


  • Il tag <link> definisce una relazione tra il documento corrente e una risorsa esterna
  • È un tag vuoto (auto-chiudente) - non ha contenuto tra apertura e chiusura
  • Deve essere posizionato all'interno della sezione <head> del documento
  • L'attributo più comune è rel="stylesheet" per collegare file CSS
  • Supporta attributi globali, specifici ed eventi
  • Fondamentale per il caricamento di risorse esterne

<nav

    [attributi_globali]
    [attributi_evento]

>
    ... CONTENUTO DELLA NAVIGAZIONE (link, liste, ecc.) ...
</nav>

 <nav>
      │
      ├── [attributi_globali]
      │
      ├── <h2>Menu principale</h2>
      │
      ├── <ul> o <ol>
      │    │
      │    ├── <li>
      │    │    └── <a href="/">Home</a>
      │    │
      │    ├── <li>
      │    │    └── <a href="/chi-siamo">Chi Siamo</a>
      │    │
      │    └── <li>
      │         └── <a href="/contatti">Contatti</a>
      │
      ├── <a href="/">Home</a>
      ├── <a href="/chi-siamo">Chi Siamo</a>
      └── <a href="/contatti">Contatti</a>


   • Il tag <nav> definisce una sezione di navigazione in una pagina web
   • Contiene collegamenti di navigazione principali (menu, indice, breadcrumb)
   • È un elemento semantico - non ha effetti visivi intrinseci
   • Supporta attributi globali ed eventi (NON ha attributi specifici)
   • Può essere utilizzato più volte nella stessa pagina (menu principale, menu footer, ecc.)

     UTILIZZI PRINCIPALI:
     • Menu di navigazione principale del sito
     • Menu secondari (categorie, sezioni)
     • Breadcrumb (briciole di pane)
     • Indice della pagina (table of contents)
     • Link ai social media
     • Paginazione (next/prev)

     REGOLE FONDAMENTALI:
     • Deve contenere principalmente link di navigazione
     • Non tutti i link devono stare in <nav> (es. link in footer secondario)
     • Di solito contiene liste <ul>/<ol> con link <a>
     • Per accessibilità, è buona pratica includere un titolo (con aria-label o aria-labelledby)
