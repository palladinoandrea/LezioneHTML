╔═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════╗
║                                                          TAG <header>                                                                 ║
╚═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════╝

╔═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════╗
║                                                    NOTE E CONSIGLI                                                                    ║
╠═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════╣
║                                                                                                                                       ║
║ • Il tag <header> rappresenta un contenitore introduttivo o un gruppo di aiuti alla navigazione.                                     ║
║ • Può contenere intestazioni (h1-h6), loghi, menu di navigazione, icone, ecc.                                                        ║
║ • Non va confuso con <head> (che contiene metadati) o con <h1>-<h6> (intestazioni di sezione).                                      ║
║ • Può essere utilizzato più volte in una pagina (intestazione principale, intestazioni di articoli, ecc.).                           ║
║ • Di solito è posizionato all'inizio di una sezione o all'inizio della pagina.                                                        ║
║ • È un elemento puramente semantico, non ha alcun effetto visivo intrinseco (tranne quelli del browser di default).                 ║
║ • È un elemento "contenitore" (come <div>) ma con significato semantico.                                                             ║
║ • Supporta attributi globali ed eventi come qualsiasi altro elemento.                                                                ║
║                                                                                                                                       ║
║ 📚 USO CORRETTO:                                                                                                                      ║
║   • <header> principale della pagina: di solito contiene il logo e il menu principale.                                               ║
║   • <header> di un articolo: può contenere il titolo, la data, l'autore.                                                             ║
║   • Non va usato all'interno di <footer> o <address>.                                                                                ║
║   • Non va usato come contenitore generico (usa <div> per quello).                                                                   ║
║                                                                                                                                       ║
║ 🆚 DIFFERENZA CON <head> E <h1-6>:                                                                                                    ║
║   • <head> → Contiene metadati della pagina (non visibile).                                                                          ║
║   • <h1>-<h6> → Intestazioni di sezione (titoli veri e propri).                                                                      ║
║   • <header> → Contenitore introduttivo che può includere <h1-6>, ma anche altri elementi.                                           ║
║                                                                                                                                       ║
╚═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════╝
