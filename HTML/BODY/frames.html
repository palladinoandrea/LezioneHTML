• Il tag <iframe> (inline frame) incorpora un'altra pagina HTML all'interno della pagina corrente                                    ║
• Ampiamente supportato e utilizzato per incorporare contenuti esterni (video YouTube, mappe Google, ecc.)                           ║
• Deve essere posizionato all'interno del <body>                                                                                     ║
 • Supporta attributi globali, specifici ed eventi                                                                                    ║
 • Importante per la sicurezza: usare sandbox per contenuti non fidati                                                                ║
                                                                                                                                      ║
🔒 SICUREZZA:                                                                                                                         ║
• sandbox: limita le funzionalità del contenuto incorporato                                                                        ║
• allow: permette funzionalità specifiche (geolocation, camera, ecc.)                                                              ║
• referrerpolicy: controlla le informazioni inviate                                                                                ║
• loading: lazy loading per performance
